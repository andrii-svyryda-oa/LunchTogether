name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Trim whitespace/newlines the secret picker might have let through.
          SERVER_HOST="$(printf '%s' "$SERVER_HOST" | tr -d '[:space:]')"
          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST secret is empty" >&2
            exit 1
          fi

          # Verify it resolves before ssh-keyscan complains cryptically.
          if ! getent hosts "$SERVER_HOST" >/dev/null; then
            echo "ERROR: SERVER_HOST does not resolve. Length=${#SERVER_HOST}." >&2
            echo "Make sure the secret is a bare hostname or IP (no http://, no /, no port)." >&2
            exit 1
          fi

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Application
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          SERVER_HOST="$(printf '%s' "$SERVER_HOST" | tr -d '[:space:]')"
          SERVER_USER="$(printf '%s' "$SERVER_USER" | tr -d '[:space:]')"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" << 'ENDSSH'
            set -e

            # Navigate to application directory
            cd /var/www/lunchtogether

            echo "Pulling latest code..."
            sudo -u lunchtogether git fetch origin
            sudo -u lunchtogether git reset --hard origin/main

            echo "Deploying backend..."
            cd backend
            sudo -u lunchtogether /home/lunchtogether/.local/bin/uv sync
            sudo -u lunchtogether /home/lunchtogether/.local/bin/uv run alembic upgrade head
            sudo systemctl restart lunchtogether-backend

            # Wait and check if backend started successfully
            sleep 3
            if ! systemctl is-active --quiet lunchtogether-backend; then
              echo "Backend failed to start!"
              sudo journalctl -u lunchtogether-backend -n 50
              exit 1
            fi

            echo "Backend deployed successfully"

            echo "Deploying frontend..."
            cd ../frontend
            sudo -u lunchtogether npm ci --include=dev
            sudo -u lunchtogether npm run build

            # Make sure nginx (running as www-data) can traverse the dist tree.
            sudo chown -R lunchtogether:www-data dist
            sudo chmod -R 755 dist

            echo "Reloading nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Frontend deployed successfully"
          ENDSSH

      - name: Health Check
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          sleep 5
          DOMAIN="$(printf '%s' "$DOMAIN" | tr -d '[:space:]')"
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://$DOMAIN/api/health" || true)
          if [ "$response" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check failed (HTTP $response)"
            exit 1
          fi

      - name: Notify Deployment
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
          fi
