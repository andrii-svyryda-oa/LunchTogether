name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies (incl. dev group)
        working-directory: ./backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --dev

      - name: Run tests
        working-directory: ./backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -v
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
          JWT_SECRET_KEY: test-secret
          UPLOAD_DIR: /tmp/uploads
          ENVIRONMENT: test

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies (incl. dev group)
        working-directory: ./backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --dev

      - name: Run ruff linting
        working-directory: ./backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check .

      - name: Run ruff formatting check
        working-directory: ./backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check .

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npm run type-check

      - name: Build
        working-directory: ./frontend
        run: npm run build

      # ESLint and test steps intentionally omitted: no ESLint config or test
      # runner is set up yet. Re-enable after adding eslint.config.js and a
      # test framework (e.g. vitest):
      # - run: npm run lint
      # - run: npm run test
