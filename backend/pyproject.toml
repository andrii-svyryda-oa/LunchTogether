[project]
name = "lunchtogether-backend"
version = "0.1.0"
description = "LunchTogether - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "bcrypt",
    "python-multipart",
    "sentry-sdk[fastapi]",
    "aiofiles",
    "aiosmtplib",
    "email-validator",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (needed for FastAPI Depends)
    # TODO: revisit these; silenced during CI setup so the first pipeline run is green.
    "UP042", # `class X(str, Enum)` style — migrate to StrEnum once we verify JSON/str()
             # serialization behavior doesn't change for API consumers.
    "UP046", # PEP 695 type params — refactor BaseRepository / PaginatedResponse when we
             # bump minimum Python or have time for the structural change.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic auto-generated migrations: long SQL/data literals are expected.
"alembic/versions/*.py" = ["E501"]
# Email HTML templates contain long inline markup strings.
"app/core/email.py" = ["E501"]
# Test function signatures with many fixtures routinely exceed the line limit.
"tests/**/*.py" = ["E501"]

[dependency-groups]
dev = [
    "ty>=0.0.16",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]
